# Headless Service (clusterIP: None): internal-only, gives the StatefulSet
# stable DNS names (mongodb-0.mongodb.default.svc.cluster.local).
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  labels:
    app: mongodb
spec:
  clusterIP: None
  selector:
    app: mongodb
  ports:
    - port: 27017
      targetPort: 27017
